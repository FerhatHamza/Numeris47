    --brand:#0f766e;
    --brand-2:#0d9488;

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Arabic',Tahoma,sans-serif;

  }
  header{
    background:linear-gradient(135deg,#0f766e 0%,#115e59 55%,#134e4a 100%);
    color:#fff;
    padding:26px 22px 30px;
  }
  .head-inner{max-width:1400px;margin:0 auto}
  .head-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{
    width:52px;height:52px;border-radius:14px;
    background:rgba(255,255,255,.16);
    display:grid;place-items:center;font-size:26px;
    border:1px solid rgba(255,255,255,.25);
  }
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
  .sub{font-size:13px;opacity:.85;margin-top:3px}
  .badge{
    margin-left:auto;background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
    white-space:nowrap;
  }
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;max-width:1400px;margin:-18px auto 0;padding:0 22px;
    position:relative;z-index:2;
  }
  .stat{
    background:var(--card);border-radius:14px;padding:14px 16px;
    box-shadow:0 2px 10px rgba(16,32,48,.08);
    border:1px solid var(--line);
  }
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
  .stat .v{font-size:24px;font-weight:800;margin-top:4px;color:var(--brand)}
  main{max-width:1400px;margin:0 auto;padding:22px}

  .toolbar{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    box-shadow:0 2px 10px rgba(16,32,48,.05);
  }
  .search{position:relative;flex:1 1 280px;min-width:220px}
  .search input{
    width:100%;padding:11px 14px 11px 38px;border-radius:10px;
    border:1px solid var(--line);font-size:14px;outline:none;background:#fbfcfe;
    transition:.15s;
  }
  .search input:focus{border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  .search::before{
    content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.55;
  }
  select{
    padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fbfcfe;font-size:14px;outline:none;cursor:pointer;max-width:280px;
  }
  select:focus{border-color:var(--brand-2)}
  button{
    padding:11px 18px;border-radius:10px;border:none;cursor:pointer;
    font-size:14px;font-weight:700;transition:.15s;white-space:nowrap;
  }
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(15,118,110,.28)}
  .btn-primary:hover{background:var(--brand-2);transform:translateY(-1px)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:#f1f5f9}

  .tablewrap{
    margin-top:16px;background:var(--card);border-radius:14px;border:1px solid var(--line);
    overflow:auto;max-height:calc(100vh - 120px);
    box-shadow:0 2px 10px rgba(16,32,48,.05);
  }
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
  thead th{
    position:sticky;top:0;z-index:3;background:#eef4f8;color:#334155;
    text-align:left;padding:11px 12px;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.6px;font-weight:800;border-bottom:2px solid #dbe4ec;
    cursor:pointer;user-select:none;white-space:nowrap;
  }
  thead th:hover{background:#e3ecf3}
  thead th .arrow{opacity:.35;font-size:10px;margin-left:4px}
  thead th.sorted .arrow{opacity:1;color:var(--brand)}
  tbody td{
    padding:10px 12px;border-bottom:1px solid #eef2f6;vertical-align:top;
  }
  tbody tr:nth-child(even){background:#fafcfd}
  tbody tr:hover{background:var(--brand-soft)}
  .ref{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#0f766e;font-weight:700;white-space:nowrap}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#475569;white-space:nowrap}
  .grade-pill{
    display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;
    background:#eef2f7;color:#334155;font-weight:600;white-space:nowrap;
  }
  .grade-pill.med{background:#e0f2fe;color:#075985}
  .grade-pill.inf{background:#dcfce7;color:#166534}
  .grade-pill.bio{background:#f3e8ff;color:#6b21a8}
  .grade-pill.psy{background:#fef3c7;color:#92400e}
  .grade-pill.admin{background:#fee2e2;color:#991b1b}
  .grade-pill.tech{background:#e2e8f0;color:#334155}
  .email{color:#0f766e;text-decoration:none;font-size:12.5px}
  .email:hover{text-decoration:underline}
  .empty{text-align:center;padding:50px;color:var(--muted)}
  .empty div:first-child{font-size:34px;margin-bottom:8px}
  footer{text-align:center;padding:22px;color:var(--muted);font-size:12px}
  .warn{
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:10px 14px;border-radius:10px;font-size:13px;margin-top:12px;
  }
  .toast{
    position:fixed;bottom:24px;right:24px;background:#0f766e;color:#fff;
    padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;
    box-shadow:0 10px 30px rgba(15,118,110,.35);
    opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:99;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  @media(max-width:640px){
    .head-top{gap:10px}
    h1{font-size:17px}
    .badge{margin-left:0;width:100%;text-align:center}
    main{padding:14px}
  }
</style>

/* ============================================================
   CONFIG COLONNES
   ============================================================ */
const COLS = [
  {key:"ref",   label:"Référence", w:22, cls:"ref"},
  {key:"nom",   label:"Nom",       w:20},
  {key:"prenom",label:"Prénom",    w:20},
  {key:"grade", label:"Grade",     w:42},
  {key:"nin",   label:"NIN",       w:22, cls:"mono"},
  {key:"nss",   label:"NSS",       w:16, cls:"mono"},
  {key:"tel",   label:"Téléphone", w:15, cls:"mono"},
  {key:"email", label:"E-mail",    w:32},
  {key:"date",  label:"Date soumission", w:18, cls:"mono"}
];

let state = { q:"", grade:"", sortKey:"date", sortDir:"asc" };
let view = [];

/* ============================================================
   UTILITAIRES
   ============================================================ */
function pillClass(grade){
  const g = (grade||"").toLowerCase();
  if(g.includes("médecin")) return "med";
  if(g.includes("infirmier")||g.includes("sage-femme")||g.includes("aide-soignant")) return "inf";
  if(g.includes("biologiste")||g.includes("laborantin")) return "bio";
  if(g.includes("psychologue")) return "psy";
  if(g.includes("administrateur")||g.includes("attaché")) return "admin";
  return "tech";
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateKey(d){ // "06/10/2026 21:45" -> "20261006 21:45"
  const m = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/.exec(d||"");
  return m ? `${m[3]}${m[2]}${m[1]}${m[4]}${m[5]}` : "";
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   STATISTIQUES
   ============================================================ */
function buildStats(){
  const total = DATA.length;
  const med = DATA.filter(d=>/médecin/i.test(d.grade)).length;
  const param = DATA.filter(d=>/infirmier|sage-femme|aide-soignant|manipulateur|laborantin|hygiéniste|assistant en fauteuil/i.test(d.grade)).length;
  const bio = DATA.filter(d=>/biologiste|laborantin/i.test(d.grade)).length;
  const admin = DATA.filter(d=>/administrateur|attaché|ouvrier/i.test(d.grade)).length;
  const cards = [
    ["Total fiches", total],
    ["Médecins", med],
    ["Paramédicaux", param],
    ["Biologistes", bio],
    ["Admin / Ouvriers", admin]
  ];
  document.getElementById('stats').innerHTML = cards.map(([k,v])=>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`
  ).join('');
}

/* ============================================================
   FILTRE PAR GRADE
   ============================================================ */
function buildGradeFilter(){
  const sel = document.getElementById('gradeFilter');
  const grades = [...new Set(DATA.map(d=>d.grade))].sort((a,b)=>a.localeCompare(b,'fr'));
  sel.innerHTML = '<option value="">Tous les grades</option>' +
    grades.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
}

/* ============================================================
   EN-TÊTES
   ============================================================ */
function buildHead(){
  document.getElementById('headRow').innerHTML = COLS.map(c=>{
    const sorted = state.sortKey === c.key;
    const arrow = sorted ? (state.sortDir === 'asc' ? '▲' : '▼') : '↕';
    return `<th data-key="${c.key}" class="${sorted?'sorted':''}">${esc(c.label)}<span class="arrow">${arrow}</span></th>`;
  }).join('');
  document.querySelectorAll('#headRow th').forEach(th=>{
    th.onclick = ()=>{
      const k = th.dataset.key;
      if(state.sortKey === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = k; state.sortDir = 'asc'; }
      render();
    };
  });
}

/* ============================================================
   RENDU
   ============================================================ */
function render(){
  const q = state.q.trim().toLowerCase();

  view = DATA.filter(d=>{
    if(state.grade && d.grade !== state.grade) return false;
    if(!q) return true;
    return [d.ref,d.nom,d.prenom,d.grade,d.nin,d.nss,d.tel,d.email,d.date]
      .join(' ').toLowerCase().includes(q);
  });

  const k = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
  view.sort((a,b)=>{
    let va = a[k]||"", vb = b[k]||"";
    if(k === 'date'){ va = dateKey(va); vb = dateKey(vb); }
    return va.localeCompare(vb, 'fr', {numeric:true}) * dir;
  });

  buildHead();

  const tbody = document.getElementById('tbody');
  if(view.length === 0){
    tbody.innerHTML = `<tr><td colspan="${COLS.length}" class="empty">
      <div>🔎</div><div>Aucun résultat pour cette recherche</div></td></tr>`;
  } else {
    tbody.innerHTML = view.map((d,i)=>{
      return `<tr>
        <td class="ref">${esc(d.ref)}</td>
        <td dir="auto"><strong>${esc(d.nom)}</strong></td>
        <td dir="auto">${esc(d.prenom)}</td>
        <td><span class="grade-pill ${pillClass(d.grade)}">${esc(d.grade)}</span></td>
        <td class="mono">${esc(d.nin)||'—'}</td>
        <td class="mono">${esc(d.nss)||'—'}</td>
        <td class="mono">${esc(d.tel)||'—'}</td>
        <td><a class="email" href="mailto:${esc(d.email)}">${esc(d.email)||'—'}</a></td>
        <td class="mono">${esc(d.date)}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('shown').textContent = view.length;
  checkDuplicates();
}

/* ============================================================
   DOUBLONS
   ============================================================ */
function checkDuplicates(){
  const map = {};
  DATA.forEach(d=>{
    const key = (d.nin||'').trim();
    if(!key) return;
    map[key] = map[key] || [];
    map[key].push(d);
  });
  const dups = Object.values(map).filter(a=>a.length>1);
  const box = document.getElementById('dupWarn');
  if(dups.length === 0){ box.innerHTML = ''; return; }
  const lines = dups.map(a=>{
    const d = a[0];
    return `• <strong>${esc(d.nom)} ${esc(d.prenom)}</strong> — NIN ${esc(d.nin)} — ${a.length} fiches (${a.map(x=>esc(x.ref)).join(', ')})`;
  }).join('<br>');
  box.innerHTML = `<div class="warn">⚠️ <strong>Doublons détectés (${dups.length})</strong><br>${lines}</div>`;
}

/* ============================================================
   EXPORT EXCEL
   ============================================================ */
function rowsForExport(){
  const src = view.length ? view : DATA;
  const header = ["N°", ...COLS.map(c=>c.label)];
  const rows = src.map((d,i)=>{
    return [i+1, d.ref, d.nom, d.prenom, d.grade, d.nin, d.nss, d.tel, d.email, d.date];
  });
  return { header, rows, src };
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){
    toast("Bibliothèque Excel indisponible → export CSV");
    return exportCSV();
  }
  const { header, rows } = rowsForExport();

  // AOA : on force tout en texte pour préserver NIN/NSS/téléphones
  const aoa = [header, ...rows.map(r => r.map(v => (v==null||v==='') ? '' : String(v)))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  // Toutes les cellules en type texte
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let R = range.s.r; R <= range.e.r; ++R){
    for(let C = range.s.c; C <= range.e.c; ++C){
      const addr = XLSX.utils.encode_cell({r:R, c:C});
      const cell = ws[addr];
      if(!cell) continue;
      cell.t = 's';
      if(R === 0){
        cell.s = { font:{bold:true, color:{rgb:"FFFFFF"}}, fill:{fgColor:{rgb:"0F766E"}},
                   alignment:{horizontal:"center", vertical:"center"} };
      }
    }
  }

  ws['!cols'] = [
    {wch:5},  {wch:22}, {wch:20}, {wch:20}, {wch:42},
    {wch:22}, {wch:16}, {wch:15}, {wch:32}, {wch:18}
  ];
  ws['!freeze'] = { xSplit:"0", ySplit:"1" };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Fiches Médecins");

  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Fiches_Medecins_DSP_Ghardaia_${stamp}.xlsx`);
  toast(`Export Excel : ${rows.length} fiche(s) ✓`);
}

/* ============================================================
   EXPORT CSV
   ============================================================ */
function exportCSV(){
  const { header, rows } = rowsForExport();
  const sep = ';'; // Excel FR
  const q = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [header, ...rows].map(r=>r.map(q).join(sep)).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Fiches_Medecins_DSP_Ghardaia_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Export CSV : ${rows.length} fiche(s) ✓`);
}

/* ============================================================
   RESET
   ============================================================ */
function resetAll(){
  state = { q:"", grade:"", sortKey:"date", sortDir:"asc" };
  document.getElementById('q').value = '';
  document.getElementById('gradeFilter').value = '';
  render();
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('q').addEventListener('input', e=>{
  state.q = e.target.value;
  render();
});
document.getElementById('gradeFilter').addEventListener('change', e=>{
  state.grade = e.target.value;
  render();
});

buildStats();
buildGradeFilter();
render();
</script>

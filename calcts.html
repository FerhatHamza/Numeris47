<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de note — QCM sur 1,5</title>
<style>
  :root {
    --sante: #005a8c;
    --sante-light: #e6f1f8;
    --success: #0a8754;
    --warning: #d97706;
    --danger: #c0392b;
    --gray: #6b7280;
    --bg: #f4f7fa;
    --card: #ffffff;
    --border: #d1dbe5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #1f2937;
  }
  .container {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 90, 140, 0.15);
    max-width: 520px;
    width: 100%;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .content { padding: 28px 24px 32px; }
  h1 {
    font-size: 20px;
    color: var(--sante);
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: var(--gray);
    font-size: 13px;
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #374151;
    font-size: 14px;
  }
  input[type="number"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 22px;
    font-weight: bold;
    border: 2px solid var(--border);
    border-radius: 10px;
    text-align: center;
    color: var(--sante);
    transition: border-color 0.2s;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--sante);
    box-shadow: 0 0 0 4px var(--sante-light);
  }
  input[type="range"] {
    width: 100%;
    margin: 14px 0 8px;
    accent-color: var(--sante);
  }
  .quick-btns {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin: 12px 0 22px;
  }
  .quick-btns button {
    padding: 8px 0;
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    font-weight: 600;
    color: var(--sante);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .quick-btns button:hover {
    background: var(--sante);
    color: white;
    border-color: var(--sante);
  }
  .result {
    background: var(--sante-light);
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    transition: all 0.3s;
    border: 2px solid transparent;
  }
  .result.success { background: #e7f7ee; border-color: var(--success); }
  .result.warning { background: #fef3c7; border-color: var(--warning); }
  .result.danger  { background: #fdeaea; border-color: var(--danger); }
  .result-label {
    font-size: 13px;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .note {
    font-size: 56px;
    font-weight: 900;
    color: var(--sante);
    line-height: 1.1;
    margin: 6px 0;
  }
  .result.success .note { color: var(--success); }
  .result.warning .note { color: var(--warning); }
  .result.danger  .note { color: var(--danger); }
  .note small { font-size: 22px; font-weight: 600; opacity: 0.7; }
  .percentage {
    font-size: 15px;
    color: var(--gray);
    margin-top: 4px;
  }
  .detail {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px dashed var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 13px;
  }
  .detail-item {
    background: #f9fafb;
    padding: 10px 12px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .detail-item span:first-child { color: var(--gray); }
  .detail-item span:last-child { font-weight: 700; color: var(--sante); }
  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--gray);
    padding: 14px;
    border-top: 1px solid var(--border);
    background: #f9fafb;
  }
</style>
</head>
<body>

<div class="container">
  <div class="content">
    <h1>Calculateur de note — QCM</h1>
    <div class="subtitle">12 questions · 1 point par bonne réponse · Note finale sur 1,5</div>

    <label for="correct">Nombre de bonnes réponses (sur 12) :</label>
    <input type="number" id="correct" min="0" max="12" value="0" placeholder="0–12">
    <input type="range" id="slider" min="0" max="12" value="0">

    <div class="quick-btns">
      <button data-val="0">0</button>
      <button data-val="2">2</button>
      <button data-val="4">4</button>
      <button data-val="6">6</button>
      <button data-val="8">8</button>
      <button data-val="10">10</button>
      <button data-val="12">12</button>
    </div>

    <div class="result" id="result">
      <div class="result-label">Note obtenue / 1,5</div>
      <div class="note" id="note">0,00 <small>/ 1,5</small></div>
      <div class="percentage" id="percentage">0 %</div>

      <div class="detail">
        <div class="detail-item">
          <span>Bonnes réponses</span>
          <span id="detail-correct">0 / 12</span>
        </div>
        <div class="detail-item">
          <span>Mauvaises réponses</span>
          <span id="detail-wrong">12 / 12</span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    Formule : note = (bonnes réponses ÷ 12) × 1,5
  </div>
</div>

<script>
  const input   = document.getElementById('correct');
  const slider  = document.getElementById('slider');
  const noteEl  = document.getElementById('note');
  const pctEl   = document.getElementById('percentage');
  const resEl   = document.getElementById('result');
  const dCorr   = document.getElementById('detail-correct');
  const dWrong  = document.getElementById('detail-wrong');

  const TOTAL_Q   = 12;    // nombre de questions
  const NOTE_MAX  = 1.5;   // note maximale

  function compute() {
    let val = parseInt(input.value, 10);
    if (isNaN(val)) val = 0;
    val = Math.max(0, Math.min(TOTAL_Q, val));

    input.value  = val;
    slider.value = val;

    // Calcul de la note
    const note = (val / TOTAL_Q) * NOTE_MAX;
    const pct  = (val / TOTAL_Q) * 100;
    const wrong = TOTAL_Q - val;

    // Affichage avec virgule française et 2 décimales
    const noteStr = note.toFixed(2).replace('.', ',');
    noteEl.innerHTML = `${noteStr} <small>/ 1,5</small>`;

    pctEl.textContent = `${Math.round(pct)} %`;
    dCorr.textContent  = `${val} / ${TOTAL_Q}`;
    dWrong.textContent = `${wrong} / ${TOTAL_Q}`;

    // Couleur
    resEl.classList.remove('success', 'warning', 'danger');
    if (pct >= 70)      resEl.classList.add('success');
    else if (pct >= 50) resEl.classList.add('warning');
    else                resEl.classList.add('danger');
  }

  input.addEventListener('input', compute);
  slider.addEventListener('input', () => {
    input.value = slider.value;
    compute();
  });

  document.querySelectorAll('.quick-btns button').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.val;
      compute();
    });
  });

  compute();
</script>
</body>
</html>

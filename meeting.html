<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Todo Liste</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    line-height: 1.5;
  }

  .app {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(15, 23, 42, .08);
    overflow: hidden;
    height: fit-content;
  }

  /* Header */
  .head {
    padding: 24px 24px 20px;
    background: linear-gradient(135deg, #1d4ed8, #0d9488);
    color: #fff;
  }
  .head h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .head p {
    font-size: .85rem;
    opacity: .85;
    margin-top: 4px;
  }

  /* Add form */
  .add {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-bottom: 1px solid #e2e8f0;
  }
  .add input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: .95rem;
    font-family: inherit;
    outline: none;
    transition: .15s;
  }
  .add input:focus {
    border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(29, 78, 216, .1);
  }
  .add button {
    padding: 12px 20px;
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: .9rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: .15s;
  }
  .add button:hover { background: #1e3a8a; }
  .add button:active { transform: scale(.97); }

  /* Filters */
  .filters {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  .filters button {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: none;
    border-radius: 8px;
    font-size: .85rem;
    font-weight: 600;
    font-family: inherit;
    color: #64748b;
    cursor: pointer;
    transition: .15s;
  }
  .filters button:hover { background: #eef2ff; color: #1d4ed8; }
  .filters button.active {
    background: #1d4ed8;
    color: #fff;
  }

  /* List */
  .list {
    list-style: none;
    max-height: 480px;
    overflow-y: auto;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid #f1f5f9;
    transition: .15s;
    animation: slideIn .2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }
  .item:hover { background: #f8fafc; }
  .item:last-child { border-bottom: none; }

  .item input[type="checkbox"] {
    appearance: none;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid #cbd5e1;
    border-radius: 7px;
    cursor: pointer;
    transition: .15s;
    position: relative;
  }
  .item input[type="checkbox"]:hover { border-color: #0d9488; }
  .item input[type="checkbox"]:checked {
    background: #0d9488;
    border-color: #0d9488;
  }
  .item input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    color: #fff;
    font-size: .85rem;
    font-weight: 900;
    display: grid;
    place-items: center;
  }

  .item .txt {
    flex: 1;
    font-size: .95rem;
    word-break: break-word;
    transition: .15s;
  }
  .item.done .txt {
    text-decoration: line-through;
    color: #94a3b8;
  }

  .item .del {
    background: none;
    border: none;
    color: #cbd5e1;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 7px;
    transition: .15s;
    line-height: 1;
  }
  .item .del:hover {
    background: #fee2e2;
    color: #dc2626;
  }

  /* Empty */
  .empty {
    padding: 60px 20px;
    text-align: center;
    color: #94a3b8;
  }
  .empty .ic { font-size: 2.5rem; margin-bottom: 8px; }
  .empty p { font-size: .9rem; }

  /* Footer */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    font-size: .82rem;
    color: #64748b;
    font-weight: 600;
  }
  .foot .clear {
    background: none;
    border: none;
    color: #64748b;
    font-size: .82rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 7px;
    transition: .15s;
  }
  .foot .clear:hover {
    background: #fee2e2;
    color: #dc2626;
  }

  @media (max-width: 480px) {
    body { padding: 0; }
    .app { border-radius: 0; min-height: 100vh; }
    .add { flex-wrap: wrap; }
    .add input { min-width: 100%; }
    .add button { width: 100%; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <h1>✅ Ma Todo Liste</h1>
    <p>Tout est enregistré automatiquement.</p>
  </div>

  <div class="add">
    <input type="text" id="input" placeholder="Ajouter une tâche…" autocomplete="off">
    <button id="addBtn">Ajouter</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">Toutes</button>
    <button data-filter="active">Actives</button>
    <button data-filter="done">Terminées</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="foot">
    <span id="count">0 tâche</span>
    <button class="clear" id="clearDone">Effacer terminées</button>
  </div>
</div>

<script>
const KEY = 'simple_todo_v1';
const $ = id => document.getElementById(id);

let todos = load();
let filter = 'all';

/* --- chargement / sauvegarde --- */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [
    { id: uid(), txt: 'Relancer Algérie Télécom', done: false },
    { id: uid(), txt: 'Envoyer le modèle Excel RH', done: false },
    { id: uid(), txt: 'Préparer la réunion Support/Dev', done: true }
  ];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {}
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

/* --- actions --- */
function addTodo() {
  const input = $('input');
  const txt = input.value.trim();
  if (!txt) { input.focus(); return; }

  todos.unshift({ id: uid(), txt, done: false });
  input.value = '';
  input.focus();
  render();
}

function toggle(id) {
  const t = todos.find(x => x.id === id);
  if (t) { t.done = !t.done; render(); }
}

function remove(id) {
  todos = todos.filter(x => x.id !== id);
  render();
}

function clearDone() {
  const n = todos.filter(t => t.done).length;
  if (!n) return;
  if (confirm(`Effacer ${n} tâche(s) terminée(s) ?`)) {
    todos = todos.filter(t => !t.done);
    render();
  }
}

/* --- affichage --- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function render() {
  const list = $('list');

  let visible = todos;
  if (filter === 'active') visible = todos.filter(t => !t.done);
  if (filter === 'done')   visible = todos.filter(t => t.done);

  if (!visible.length) {
    const msg = filter === 'done'   ? 'Aucune tâche terminée.'
              : filter === 'active' ? 'Aucune tâche active — tout est fait 🎉'
              : 'Votre liste est vide. Ajoutez une tâche ci-dessus.';
    list.innerHTML = `<li class="empty"><div class="ic">📝</div><p>${msg}</p></li>`;
  } else {
    list.innerHTML = visible.map(t => `
      <li class="item ${t.done ? 'done' : ''}">
        <input type="checkbox" data-toggle="${t.id}" ${t.done ? 'checked' : ''}>
        <span class="txt">${esc(t.txt)}</span>
        <button class="del" data-del="${t.id}" title="Supprimer">🗑</button>
      </li>
    `).join('');
  }

  const remaining = todos.filter(t => !t.done).length;
  $('count').textContent = remaining + (remaining === 1 ? ' tâche restante' : ' tâches restantes');

  save();
}

/* --- événements --- */
$('addBtn').addEventListener('click', addTodo);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});

$('list').addEventListener('change', e => {
  const cb = e.target.closest('input[data-toggle]');
  if (cb) toggle(cb.dataset.toggle);
});

$('list').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) remove(del.dataset.del);
});

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

$('clearDone').addEventListener('click', clearDone);

/* --- démarrage --- */
render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Liste — Toutes les Tâches</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    min-height: 100vh;
    padding: 30px 16px;
    line-height: 1.5;
  }

  .app {
    max-width: 780px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(15, 23, 42, .08);
    overflow: hidden;
  }

  /* Header */
  .head {
    padding: 26px 28px;
    background: linear-gradient(135deg, #1d4ed8, #0d9488);
    color: #fff;
  }
  .head h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .head p { font-size: .88rem; opacity: .88; margin-top: 4px; }

  /* Progress */
  .progress {
    padding: 16px 28px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  .progress .top {
    display: flex;
    justify-content: space-between;
    font-size: .85rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .progress .top span:last-child { color: #64748b; }
  .bar {
    height: 10px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #1d4ed8, #0d9488);
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* Filters */
  .filters {
    display: flex;
    gap: 4px;
    padding: 14px 28px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
  }
  .filters button {
    padding: 8px 16px;
    background: transparent;
    border: none;
    border-radius: 8px;
    font-size: .85rem;
    font-weight: 600;
    font-family: inherit;
    color: #64748b;
    cursor: pointer;
    transition: .15s;
  }
  .filters button:hover { background: #eef2ff; color: #1d4ed8; }
  .filters button.active { background: #1d4ed8; color: #fff; }

  /* Task list */
  .list { list-style: none; }

  .task {
    padding: 18px 28px;
    border-bottom: 1px solid #f1f5f9;
  }
  .task:last-child { border-bottom: none; }

  .task-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .task-head input[type="checkbox"] {
    appearance: none;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid #cbd5e1;
    border-radius: 7px;
    cursor: pointer;
    transition: .15s;
    position: relative;
    margin-top: 2px;
  }
  .task-head input[type="checkbox"]:hover { border-color: #0d9488; }
  .task-head input[type="checkbox"]:checked {
    background: #0d9488;
    border-color: #0d9488;
  }
  .task-head input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    color: #fff;
    font-size: .85rem;
    font-weight: 900;
    display: grid;
    place-items: center;
  }

  .task-head .title {
    flex: 1;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.4;
    cursor: pointer;
    user-select: none;
  }
  .task.done .task-head .title {
    text-decoration: line-through;
    color: #94a3b8;
  }

  .task-head .resp {
    font-size: .7rem;
    font-weight: 800;
    letter-spacing: .04em;
    padding: 4px 10px;
    border-radius: 999px;
    background: #eef2ff;
    color: #1d4ed8;
    text-transform: uppercase;
    white-space: nowrap;
    margin-top: 3px;
  }

  /* Steps */
  .steps {
    margin-top: 12px;
    margin-left: 34px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: .89rem;
    cursor: pointer;
    user-select: none;
    color: #334155;
  }
  .step input {
    appearance: none;
    width: 17px;
    height: 17px;
    min-width: 17px;
    border: 2px solid #cbd5e1;
    border-radius: 5px;
    margin-top: 2px;
    cursor: pointer;
    transition: .15s;
    position: relative;
  }
  .step input:checked { background: #0d9488; border-color: #0d9488; }
  .step input:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    color: #fff;
    font-size: .7rem;
    font-weight: 900;
    display: grid;
    place-items: center;
  }
  .step input:checked + span {
    text-decoration: line-through;
    color: #94a3b8;
  }

  /* Footer */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    font-size: .83rem;
    color: #64748b;
    font-weight: 600;
  }
  .foot .reset {
    background: none;
    border: none;
    color: #64748b;
    font-size: .83rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 8px;
    transition: .15s;
  }
  .foot .reset:hover { background: #fee2e2; color: #dc2626; }

  @media (max-width: 520px) {
    body { padding: 0; }
    .app { border-radius: 0; }
    .head, .progress, .filters, .task, .foot { padding-left: 18px; padding-right: 18px; }
    .steps { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <h1>📋 Toutes les Tâches</h1>
    <p>DFM · DMM · DRH &amp; DSS — cochez les étapes au fur et à mesure.</p>
  </div>

  <div class="progress">
    <div class="top">
      <span>Avancement global</span>
      <span id="progTxt">0 %</span>
    </div>
    <div class="bar"><i id="progBar"></i></div>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">Toutes</button>
    <button data-filter="active">En cours</button>
    <button data-filter="done">Terminées</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="foot">
    <span id="count">0 tâche</span>
    <button class="reset" id="reset">Réinitialiser</button>
  </div>
</div>

<script>
const KEY = 'all_tasks_v1';
const $ = id => document.getElementById(id);

/* =========================================================
   LES TÂCHES (données initiales)
   ========================================================= */
function seed() {
  return [
    {
      id: uid(),
      titre: 'Préparation des salles Datacenter & accélération des travaux Algérie Télécom',
      resp: 'DFM',
      steps: [
        { t: 'Inventaire des 3 sites', f: false },
        { t: 'Définition des besoins (surface, climatisation, énergie)', f: false },
        { t: 'Rédaction du cahier des charges Datacenter', f: false },
        { t: 'Contact & planification avec Algérie Télécom', f: false },
        { t: 'Lancement et accélération des travaux', f: false },
        { t: 'Réception et mise en service', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Serveurs — acquisition et configuration (5 serveurs)',
      resp: 'DFM',
      steps: [
        { t: 'Étude des besoins (CPU, RAM, stockage)', f: false },
        { t: 'Rédaction des spécifications techniques', f: false },
        { t: 'Lancement de la consultation', f: false },
        { t: 'Réception du matériel', f: false },
        { t: 'Installation & configuration', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Matériel informatique',
      resp: 'DFM',
      steps: [
        { t: 'Recensement des besoins par service', f: false },
        { t: 'Établissement du cahier des charges', f: false },
        { t: 'Validation hiérarchique', f: false },
        { t: 'Passation de la commande', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Réseaux LAN et électriques — 3 sites',
      resp: 'DFM',
      steps: [
        { t: 'Audit réseau des 3 sites', f: false },
        { t: 'Schéma d\'architecture LAN', f: false },
        { t: 'Étude électrique & onduleurs', f: false },
        { t: 'Travaux de câblage', f: false },
        { t: 'Tests et recette', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Fiches techniques des équipements',
      resp: 'DMM',
      steps: [
        { t: 'Recensement des équipements', f: false },
        { t: 'Collecte des documentations', f: false },
        { t: 'Rédaction des fiches techniques', f: false },
        { t: 'Validation et archivage', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Demande des mots de passe des équipements Radio',
      resp: 'DMM',
      steps: [
        { t: 'Inventaire des équipements Radio', f: false },
        { t: 'Rédaction de la demande officielle', f: false },
        { t: 'Transmission aux fournisseurs', f: false },
        { t: 'Réception & sécurisation des mots de passe', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Informations RH Santé — NIN, email, téléphone',
      resp: 'DRH/DSS',
      steps: [
        { t: 'Diffusion du modèle de collecte', f: false },
        { t: 'Collecte des NIN', f: false },
        { t: 'Collecte des emails professionnels', f: false },
        { t: 'Collecte des numéros de téléphone', f: false },
        { t: 'Contrôle qualité & dédoublonnage', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Liste de tous les employés en Excel',
      resp: 'DRH/DSS',
      steps: [
        { t: 'Consolidation des listes par structure', f: false },
        { t: 'Mise au format Excel normalisé', f: false },
        { t: 'Vérification des doublons', f: false },
        { t: 'Transmission à la hiérarchie', f: false }
      ]
    },
    {
      id: uid(),
      titre: 'Liste des affectations (NIN, email, phone)',
      resp: 'DRH/DSS',
      steps: [
        { t: 'Récupération du fichier de référence', f: false },
        { t: 'Rapprochement NIN / affectation', f: false },
        { t: 'Complétion email & téléphone', f: false },
        { t: 'Validation finale', f: false }
      ]
    }
  ];
}

/* =========================================================
   ÉTAT
   ========================================================= */
let tasks = load();
let filter = 'all';

function uid() { return Math.random().toString(36).slice(2, 10); }

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return seed();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
}

/* =========================================================
   UTILITAIRES
   ========================================================= */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function taskProgress(t) {
  if (!t.steps.length) return 0;
  return Math.round(t.steps.filter(s => s.f).length / t.steps.length * 100);
}
function isDone(t) { return taskProgress(t) === 100; }

/* =========================================================
   RENDU
   ========================================================= */
function render() {
  const list = $('list');

  // filter
  let visible = tasks;
  if (filter === 'active') visible = tasks.filter(t => !isDone(t));
  if (filter === 'done')   visible = tasks.filter(t => isDone(t));

  // tasks HTML
  if (!visible.length) {
    const msg = filter === 'done' ? 'Aucune tâche terminée.'
              : filter === 'active' ? 'Toutes les tâches sont terminées 🎉'
              : 'Aucune tâche.';
    list.innerHTML = `<li style="padding:60px 20px;text-align:center;color:#94a3b8;font-size:.9rem">${msg}</li>`;
  } else {
    list.innerHTML = visible.map(t => {
      const done = isDone(t);
      const steps = t.steps.map((s, i) => `
        <label class="step">
          <input type="checkbox" data-task="${t.id}" data-step="${i}" ${s.f ? 'checked' : ''}>
          <span>${esc(s.t)}</span>
        </label>
      `).join('');

      return `
        <li class="task ${done ? 'done' : ''}">
          <div class="task-head">
            <input type="checkbox" data-task-toggle="${t.id}" ${done ? 'checked' : ''}>
            <span class="title">${esc(t.titre)}</span>
            <span class="resp">${esc(t.resp)}</span>
          </div>
          <div class="steps">${steps}</div>
        </li>
      `;
    }).join('');
  }

  // global progress
  const allSteps = tasks.flatMap(t => t.steps);
  const doneSteps = allSteps.filter(s => s.f).length;
  const pct = allSteps.length ? Math.round(doneSteps / allSteps.length * 100) : 0;
  $('progBar').style.width = pct + '%';
  $('progTxt').textContent = pct + ' % (' + doneSteps + '/' + allSteps.length + ' étapes)';

  // count
  const active = tasks.filter(t => !isDone(t)).length;
  $('count').textContent = active + (active === 1 ? ' tâche en cours' : ' tâches en cours');

  save();
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
// cocher une étape
$('list').addEventListener('change', e => {
  const cb = e.target.closest('input[data-step]');
  if (cb) {
    const t = tasks.find(x => x.id === cb.dataset.task);
    if (!t) return;
    t.steps[+cb.dataset.step].f = cb.checked;
    render();
    return;
  }

  // cocher la tâche entière
  const all = e.target.closest('input[data-task-toggle]');
  if (all) {
    const t = tasks.find(x => x.id === all.dataset.taskToggle);
    if (!t) return;
    t.steps.forEach(s => s.f = all.checked);
    render();
  }
});

// filtres
document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

// réinitialiser
$('reset').addEventListener('click', () => {
  if (confirm('Réinitialiser toutes les tâches ? Toutes les cases seront décochées.')) {
    tasks = seed();
    render();
  }
});

/* =========================================================
   DÉMARRAGE
   ========================================================= */
render();
</script>

</body>
</html>

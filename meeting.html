<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Liste — Par Sous-Direction</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    min-height: 100vh;
    padding: 30px 16px;
    line-height: 1.5;
  }

  .app {
    max-width: 820px;
    margin: 0 auto;
  }

  /* Header */
  .head {
    background: linear-gradient(135deg, #1d4ed8, #0d9488);
    color: #fff;
    border-radius: 16px 16px 0 0;
    padding: 26px 28px;
  }
  .head h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .head p { font-size: .88rem; opacity: .88; margin-top: 4px; }

  /* ===== RÉSUMÉ GLOBAL ===== */
  .summary {
    background: #fff;
    padding: 22px 28px;
    border-bottom: 1px solid #e2e8f0;
  }
  .summary .sum-title {
    font-size: .75rem;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: 16px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .stat .n {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1;
  }
  .stat .l {
    font-size: .7rem;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-top: 6px;
  }
  .stat.total  .n { color: #1d4ed8; }
  .stat.done   .n { color: #16a34a; }
  .stat.active .n { color: #d97706; }
  .stat.steps  .n { color: #7c3aed; }

  /* Barre globale */
  .global-bar-wrap { margin-bottom: 20px; }
  .global-bar-wrap .bl {
    display: flex;
    justify-content: space-between;
    font-size: .85rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .global-bar-wrap .bl span:last-child { color: #1d4ed8; }
  .bar {
    height: 12px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #1d4ed8, #0d9488);
    border-radius: 999px;
    transition: width .5s ease;
  }

  /* Mini barres par section */
  .mini-bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .mini {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mini .mini-label {
    width: 90px;
    font-size: .8rem;
    font-weight: 700;
    color: #334155;
    flex-shrink: 0;
  }
  .mini .mini-bar {
    flex: 1;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .mini .mini-bar > i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width .5s ease;
  }
  .mini .mini-pct {
    width: 42px;
    text-align: right;
    font-size: .8rem;
    font-weight: 800;
    color: #475569;
  }

  /* Section */
  .section {
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
  }
  .section:last-of-type { border-radius: 0 0 16px 16px; border-bottom: none; }

  .sec-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 28px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
    user-select: none;
    transition: .15s;
  }
  .sec-head:hover { background: #eef2ff; }

  .sec-head .sec-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .sec-dfm .sec-icon   { background: #eef2ff; color: #1d4ed8; }
  .sec-dmm .sec-icon   { background: #f3e8ff; color: #7c3aed; }
  .sec-drh .sec-icon   { background: #ccfbf1; color: #0d9488; }

  .sec-head .sec-title {
    flex: 1;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .sec-head .sec-title small {
    display: block;
    font-size: .78rem;
    font-weight: 500;
    color: #64748b;
    margin-top: 2px;
  }
  .sec-head .sec-badge {
    font-size: .75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: #e2e8f0;
    color: #475569;
  }
  .sec-head .chev {
    font-size: .9rem;
    color: #94a3b8;
    transition: transform .2s;
  }
  .section.collapsed .chev { transform: rotate(-90deg); }
  .section.collapsed .sec-body { display: none; }

  /* Task inside section */
  .sec-body { padding: 4px 0; }

  .task {
    padding: 16px 28px;
    border-bottom: 1px solid #f1f5f9;
  }
  .task:last-child { border-bottom: none; }

  .task-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .task-head input[type="checkbox"] {
    appearance: none;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid #cbd5e1;
    border-radius: 7px;
    cursor: pointer;
    transition: .15s;
    position: relative;
    margin-top: 2px;
  }
  .task-head input[type="checkbox"]:hover { border-color: #0d9488; }
  .task-head input[type="checkbox"]:checked {
    background: #0d9488;
    border-color: #0d9488;
  }
  .task-head input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    color: #fff;
    font-size: .85rem;
    font-weight: 900;
    display: grid;
    place-items: center;
  }

  .task-head .title {
    flex: 1;
    font-size: .97rem;
    font-weight: 700;
    line-height: 1.4;
    cursor: pointer;
    user-select: none;
  }
  .task.done .task-head .title {
    text-decoration: line-through;
    color: #94a3b8;
  }

  .task-head .deadline {
    font-size: .72rem;
    font-weight: 800;
    letter-spacing: .03em;
    padding: 4px 10px;
    border-radius: 999px;
    background: #fef3c7;
    color: #b45309;
    text-transform: uppercase;
    white-space: nowrap;
    margin-top: 3px;
  }
  .task.done .task-head .deadline { background: #dcfce7; color: #16a34a; }

  /* Steps */
  .steps {
    margin-top: 12px;
    margin-left: 34px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: .88rem;
    cursor: pointer;
    user-select: none;
    color: #334155;
  }
  .step input {
    appearance: none;
    width: 17px;
    height: 17px;
    min-width: 17px;
    border: 2px solid #cbd5e1;
    border-radius: 5px;
    margin-top: 2px;
    cursor: pointer;
    transition: .15s;
    position: relative;
  }
  .step input:checked { background: #0d9488; border-color: #0d9488; }
  .step input:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    color: #fff;
    font-size: .7rem;
    font-weight: 900;
    display: grid;
    place-items: center;
  }
  .step input:checked + span {
    text-decoration: line-through;
    color: #94a3b8;
  }

  /* Footer */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #fff;
    border-radius: 0 0 16px 16px;
    border-top: 1px solid #e2e8f0;
    font-size: .83rem;
    color: #64748b;
    font-weight: 600;
  }
  .foot .reset {
    background: none;
    border: none;
    color: #64748b;
    font-size: .83rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 8px;
    transition: .15s;
  }
  .foot .reset:hover { background: #fee2e2; color: #dc2626; }

  @media (max-width: 620px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    body { padding: 0; }
    .app { border-radius: 0; }
    .head { border-radius: 0; }
    .head, .summary, .sec-head, .task, .foot { padding-left: 18px; padding-right: 18px; }
    .steps { margin-left: 0; }
    .mini .mini-label { width: 70px; font-size: .75rem; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <h1>📋 Todo Liste — Par Sous-Direction</h1>
    <p>DFM · DMM · DRH &amp; DSS — cochez les étapes au fur et à mesure.</p>
  </div>

  <!-- ===== RÉSUMÉ GLOBAL ===== -->
  <div class="summary">
    <div class="sum-title">📊 Résumé global</div>

    <div class="stats-grid">
      <div class="stat total">
        <div class="n" id="sTotal">0</div>
        <div class="l">Tâches</div>
      </div>
      <div class="stat done">
        <div class="n" id="sDone">0</div>
        <div class="l">Terminées</div>
      </div>
      <div class="stat active">
        <div class="n" id="sActive">0</div>
        <div class="l">En cours</div>
      </div>
      <div class="stat steps">
        <div class="n" id="sSteps">0</div>
        <div class="l">Étapes faites</div>
      </div>
    </div>

    <div class="global-bar-wrap">
      <div class="bl">
        <span>Avancement global</span>
        <span id="gPct">0 %</span>
      </div>
      <div class="bar"><i id="gBar"></i></div>
    </div>

    <div class="mini-bars" id="miniBars"></div>
  </div>

  <div id="sections"></div>

  <div class="foot">
    <span id="count">0 tâche</span>
    <button class="reset" id="reset">Réinitialiser</button>
  </div>
</div>

<script>
const KEY = 'todo_sectioned_v2';
const $ = id => document.getElementById(id);

const SECTION_COLORS = {
  dfm: '#1d4ed8',
  dmm: '#7c3aed',
  drh: '#0d9488'
};

/* =========================================================
   STRUCTURE : Sections → Tâches → Étapes
   ========================================================= */
function seed() {
  return [
    {
      id: 'dfm',
      titre: 'DFM',
      sous: '3 Cahiers de charge + Datacenter',
      icon: '⚙️',
      cls: 'sec-dfm',
      taches: [
        {
          id: uid(),
          titre: 'Cahier 1 — 5 Serveurs',
          deadline: '',
          steps: [
            { t: 'Étude des besoins (CPU, RAM, stockage)', f: false },
            { t: 'Rédaction des spécifications techniques', f: false },
            { t: 'Lancement de la consultation', f: false },
            { t: 'Réception du matériel', f: false },
            { t: 'Installation & configuration', f: false }
          ]
        },
        {
          id: uid(),
          titre: 'Cahier 2 — Matériel informatique',
          deadline: '',
          steps: [
            { t: 'Recensement des besoins par service', f: false },
            { t: 'Établissement du cahier des charges', f: false },
            { t: 'Validation hiérarchique', f: false },
            { t: 'Passation de la commande', f: false }
          ]
        },
        {
          id: uid(),
          titre: 'Cahier 3 — Réseaux LAN et électriques (3 sites)',
          deadline: '',
          steps: [
            { t: 'Audit réseau des 3 sites', f: false },
            { t: 'Schéma d\'architecture LAN', f: false },
            { t: 'Étude électrique & onduleurs', f: false },
            { t: 'Travaux de câblage', f: false },
            { t: 'Tests et recette', f: false }
          ]
        },
        {
          id: uid(),
          titre: 'Préparation des salles Datacenter & travaux Algérie Télécom',
          deadline: 'Fin octobre',
          steps: [
            { t: 'Inventaire des 3 sites', f: false },
            { t: 'Définition des besoins (surface, climatisation, énergie)', f: false },
            { t: 'Rédaction du cahier des charges Datacenter', f: false },
            { t: 'Contact & planification avec Algérie Télécom', f: false },
            { t: 'Lancement et accélération des travaux', f: false },
            { t: 'Réception et mise en service', f: false }
          ]
        }
      ]
    },
    {
      id: 'dmm',
      titre: 'DMM',
      sous: 'Fiches techniques & mots de passe Radio',
      icon: '📡',
      cls: 'sec-dmm',
      taches: [
        {
          id: uid(),
          titre: 'Fiches techniques des équipements',
          deadline: '',
          steps: [
            { t: 'Recensement des équipements', f: false },
            { t: 'Collecte des documentations', f: false },
            { t: 'Rédaction des fiches techniques', f: false },
            { t: 'Validation et archivage', f: false }
          ]
        },
        {
          id: uid(),
          titre: 'Demande des mots de passe des équipements Radio',
          deadline: 'Le plus tôt possible',
          steps: [
            { t: 'Inventaire des équipements Radio', f: false },
            { t: 'Rédaction de la demande officielle', f: false },
            { t: 'Transmission aux fournisseurs', f: false },
            { t: 'Réception & sécurisation des mots de passe', f: false }
          ]
        }
      ]
    },
    {
      id: 'drh',
      titre: 'DRH & DSS',
      sous: 'Informations RH Santé',
      icon: '🗂️',
      cls: 'sec-drh',
      taches: [
        {
          id: uid(),
          titre: 'Informations RH Santé — NIN, email, téléphone',
          deadline: '',
          steps: [
            { t: 'Diffusion du modèle de collecte', f: false },
            { t: 'Collecte des NIN', f: false },
            { t: 'Collecte des emails professionnels', f: false },
            { t: 'Collecte des numéros de téléphone', f: false },
            { t: 'Contrôle qualité & dédoublonnage', f: false }
          ]
        },
        {
          id: uid(),
          titre: 'Liste de tous les employés en Excel',
          deadline: '',
          steps: [
            { t: 'Consolidation des listes par structure', f: false },
            { t: 'Mise au format Excel normalisé', f: false },
            { t: 'Vérification des doublons', f: false },
            { t: 'Transmission à la hiérarchie', f: false }
          ]
        },
        {
          id: uid(),
          titre: 'Liste des affectations (NIN, email, phone)',
          deadline: '',
          steps: [
            { t: 'Récupération du fichier de référence', f: false },
            { t: 'Rapprochement NIN / affectation', f: false },
            { t: 'Complétion email & téléphone', f: false },
            { t: 'Validation finale', f: false }
          ]
        }
      ]
    }
  ];
}

/* =========================================================
   ÉTAT
   ========================================================= */
let sections = load();

function uid() { return Math.random().toString(36).slice(2, 10); }

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return seed();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(sections)); } catch (e) {}
}

/* =========================================================
   UTILITAIRES
   ========================================================= */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function taskDone(t) { return t.steps.length && t.steps.every(s => s.f); }

function sectionStats(sec) {
  const total = sec.taches.reduce((n, t) => n + t.steps.length, 0);
  const done  = sec.taches.reduce((n, t) => n + t.steps.filter(s => s.f).length, 0);
  const doneTasks = sec.taches.filter(taskDone).length;
  return { total, done, doneTasks, pct: total ? Math.round(done / total * 100) : 0 };
}

/* =========================================================
   RENDU
   ========================================================= */
function render() {
  /* --- Résumé global --- */
  const allTasks  = sections.flatMap(s => s.taches);
  const allSteps  = allTasks.flatMap(t => t.steps);
  const doneSteps = allSteps.filter(s => s.f).length;
  const doneTasks = allTasks.filter(taskDone).length;
  const activeTasks = allTasks.length - doneTasks;
  const globalPct = allSteps.length ? Math.round(doneSteps / allSteps.length * 100) : 0;

  $('sTotal').textContent  = allTasks.length;
  $('sDone').textContent   = doneTasks;
  $('sActive').textContent = activeTasks;
  $('sSteps').textContent  = doneSteps + '/' + allSteps.length;
  $('gPct').textContent    = globalPct + ' %';
  $('gBar').style.width    = globalPct + '%';

  /* --- Mini barres par section --- */
  $('miniBars').innerHTML = sections.map(sec => {
    const st = sectionStats(sec);
    const color = SECTION_COLORS[sec.id] || '#1d4ed8';
    return `
      <div class="mini">
        <div class="mini-label">${esc(sec.titre)}</div>
        <div class="mini-bar"><i style="width:${st.pct}%;background:${color}"></i></div>
        <div class="mini-pct">${st.pct}%</div>
      </div>
    `;
  }).join('');

  /* --- Sections --- */
  $('sections').innerHTML = sections.map(sec => {
    const st = sectionStats(sec);

    const tachesHTML = sec.taches.map(t => {
      const d = taskDone(t);
      const stepsHTML = t.steps.map((s, i) => `
        <label class="step">
          <input type="checkbox" data-task="${t.id}" data-step="${i}" ${s.f ? 'checked' : ''}>
          <span>${esc(s.t)}</span>
        </label>
      `).join('');

      return `
        <div class="task ${d ? 'done' : ''}">
          <div class="task-head">
            <input type="checkbox" data-toggle="${t.id}" ${d ? 'checked' : ''}>
            <span class="title">${esc(t.titre)}</span>
            ${t.deadline ? `<span class="deadline">⏰ ${esc(t.deadline)}</span>` : ''}
          </div>
          <div class="steps">${stepsHTML}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="section ${sec.cls}" data-section="${sec.id}">
        <div class="sec-head" data-collapse="${sec.id}">
          <div class="sec-icon">${sec.icon}</div>
          <div class="sec-title">
            ${esc(sec.titre)}
            <small>${esc(sec.sous)}</small>
          </div>
          <span class="sec-badge">${st.doneTasks}/${sec.taches.length} tâches</span>
          <span class="chev">▾</span>
        </div>
        <div class="sec-body">${tachesHTML}</div>
      </div>
    `;
  }).join('');

  /* --- Footer --- */
  const active = allTasks.filter(t => !taskDone(t)).length;
  $('count').textContent = active + (active === 1 ? ' tâche en cours' : ' tâches en cours');

  save();
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
$('sections').addEventListener('change', e => {
  const step = e.target.closest('input[data-step]');
  if (step) {
    const t = findTask(step.dataset.task);
    if (!t) return;
    t.steps[+step.dataset.step].f = step.checked;
    render();
    return;
  }

  const toggle = e.target.closest('input[data-toggle]');
  if (toggle) {
    const t = findTask(toggle.dataset.toggle);
    if (!t) return;
    t.steps.forEach(s => s.f = toggle.checked);
    render();
  }
});

$('sections').addEventListener('click', e => {
  const head = e.target.closest('[data-collapse]');
  if (!head) return;
  head.closest('.section').classList.toggle('collapsed');
});

function findTask(id) {
  for (const sec of sections) {
    const t = sec.taches.find(x => x.id === id);
    if (t) return t;
  }
  return null;
}

$('reset').addEventListener('click', () => {
  if (confirm('Réinitialiser toutes les tâches ? Toutes les cases seront décochées.')) {
    sections = seed();
    render();
  }
});

/* =========================================================
   DÉMARRAGE
   ========================================================= */
render();
</script>

</body>
</html>

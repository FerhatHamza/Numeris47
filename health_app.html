<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليلات مناصب العمل - غرداية</title>
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --bg: #f4f7f6;
            --white: #ffffff;
            --border: #e0e0e0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        
        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        header { background: var(--primary); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; }
        .print-btn { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .print-btn:hover { background: #219150; }

        /* Analytics Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: var(--white); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid var(--secondary); }
        .card h3 { margin: 0; font-size: 14px; color: #666; }
        .card p { margin: 10px 0 0 0; font-size: 28px; font-weight: bold; color: var(--primary); }

        /* Main Layout */
        .main-content { display: flex; gap: 20px; }
        .sidebar { width: 300px; background: var(--white); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .content-area { flex: 1; background: var(--white); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }

        /* Filters */
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .filter-group input, .filter-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .filter-group input[type="checkbox"] { width: auto; margin-left: 10px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 800px; }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: center; }
        th { background: #f8f9fa; color: var(--primary); font-weight: bold; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f9fbfd; }
        tr:hover { background-color: #eef5fa; }
        .highlight { font-weight: bold; color: var(--success); }

        /* Chart Container */
        .chart-container { margin-bottom: 20px; height: 300px; }

        /* Print Styles */
        @media print {
            body { background: white; padding: 0; }
            .sidebar, .print-btn, .dashboard, .chart-container { display: none !important; }
            .content-area { box-shadow: none; padding: 0; }
            table { border: 1px solid #000; }
            th, td { border: 1px solid #000; padding: 8px; font-size: 12px; }
            header { background: white !important; color: black; border-bottom: 2px solid black; border-radius: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>لوحة تحكم مناصب العمل - ولاية غرداية</h1>
        <button class="print-btn" onclick="window.print()">🖨️ طباعة التقرير</button>
    </header>

    <!-- Statistics Dashboard -->
    <div class="dashboard">
        <div class="card">
            <h3>إجمالي المناصب (المجموع)</h3>
            <p id="total-jobs">0</p>
        </div>
        <div class="card">
            <h3>عدد الأسطر (المهن)</h3>
            <p id="total-rows">0</p>
        </div>
        <div class="card">
            <h3>أعلى صنف (رقم)</h3>
            <p id="max-category">0</p>
        </div>
    </div>

    <div class="main-content">
        <!-- Sidebar Filters -->
        <div class="sidebar">
            <h3>🔍 أدوات التصفية</h3>
            
            <div class="filter-group">
                <label>البحث عن منصب (نص):</label>
                <input type="text" id="search-input" placeholder="مثال: محضر، طبيب، إلخ..." oninput="applyFilters()">
            </div>

            <div class="filter-group">
                <label>تصفية حسب الصنف:</label>
                <select id="category-filter" onchange="applyFilters()">
                    <option value="all">كل الأصناف</option>
                </select>
            </div>

            <div class="filter-group" style="display: flex; align-items: center;">
                <input type="checkbox" id="hide-zeros" onchange="applyFilters()">
                <label for="hide-zeros" style="margin-bottom:0; cursor:pointer;">إخفاء المناصب التي مجموعها 0</label>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <!-- Chart Analytics -->
            <div class="chart-container">
                <canvas id="jobsChart"></canvas>
            </div>

            <!-- Data Table -->
            <table id="data-table">
                <thead>
                    <tr>
                        <th>رقم الترتيب</th>
                        <th>الصنف</th>
                        <th>مناصب العمل</th>
                        <th>المجموع</th>
                        <th>المؤسسة الاستشفائية</th>
                        <th>مستشفى متخصص</th>
                        <th>صحة جوارية</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- DATA EXTRACTION FROM PAGE 4 ---
    // I have extracted the main data rows from the PDF. 
    // Columns: Rank, Category, Job Title, Total, Public Hospital, Specialized, Local Health
    const rawData = [
        { rank: 13, category: 7.84, title: "محضر في المسيلة متخصص للصحة العمومية", total: 3, hosp: 1, spec: 0, local: 2 },
        { rank: 12, category: 7.85, title: "محضر في المسيلة للصحة العمومية", total: 17, hosp: 9, spec: 1, local: 7 },
        { rank: 10, category: 7.86, title: "محضر في المسيلة حاصل على شهادة دولة", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 9, category: 7.87, title: "محضر في المسيلة مؤهل", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 15, category: 7.88, title: "مخضن في حفظ الصحة رئيس للصحة العمومية", total: 1, hosp: 1, spec: 0, local: 0 },
        { rank: 14, category: 7.89, title: "مخضن في حفظ الصحة ممتاز للصحة العمومية", total: 7, hosp: 1, spec: 2, local: 4 },
        { rank: 13, category: 7.90, title: "مخضن في حفظ الصحة متخصص للصحة العمومية", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 12, category: 7.91, title: "مخضن في حفظ الصحة للصحة العمومية", total: 40, hosp: 3, spec: 4, local: 33 },
        { rank: 10, category: 7.92, title: "عون تطهير حاصل على شهادة دولة", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 9, category: 7.93, title: "عون تطهير مؤهل", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 15, category: 7.94, title: "مساعد اجتماعي رئيس للصحة العمومية", total: 1, hosp: 1, spec: 0, local: 0 },
        { rank: 14, category: 7.95, title: "مساعد اجتماعي ممتاز للصحة العمومية", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 13, category: 7.96, title: "مساعد اجتماعي متخصص للصحة العمومية", total: 23, hosp: 4, spec: 2, local: 17 },
        { rank: 12, category: 7.97, title: "مساعد اجتماعي للصحة العمومية", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 10, category: 7.98, title: "مساعد اجتماعي حاصل على شهادة دولة", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 9, category: 7.99, title: "مساعد اجتماعي مؤهل", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 15, category: 8.00, title: "مساعد طبيب رئيس للصحة العمومية", total: 16, hosp: 2, spec: 0, local: 14 },
        { rank: 14, category: 8.01, title: "مساعد طبيب ممتاز للصحة العمومية", total: 9, hosp: 0, spec: 2, local: 7 },
        { rank: 13, category: 8.02, title: "مساعد طبيب متخصص للصحة العمومية", total: 36, hosp: 4, spec: 1, local: 31 },
        { rank: 12, category: 8.03, title: "مساعد طبيب للصحة العمومية", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 10, category: 8.04, title: "متقن طبي حاصل على شهادة دولة", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 9, category: 8.05, title: "متقن طبي مؤهل", total: 0, hosp: 0, spec: 0, local: 0 },
        { rank: 10, category: 8.06, title: "رتبة شبه طبي اجبي", total: 2873, hosp: 449, spec: 231, local: 2193 }
    ];

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
        populateCategoryFilter();
        renderTable(rawData);
        updateStats(rawData);
        renderChart(rawData);
    });

    // --- POPULATE FILTERS ---
    function populateCategoryFilter() {
        const categories = [...new Set(rawData.map(item => item.category))].sort((a, b) => a - b);
        const select = document.getElementById('category-filter');
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            select.appendChild(option);
        });
    }

    // --- RENDER TABLE ---
    function renderTable(data) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا توجد نتائج مطابقة للبحث</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.rank}</td>
                <td>${row.category}</td>
                <td style="text-align: right;">${row.title}</td>
                <td class="highlight">${row.total}</td>
                <td>${row.hosp}</td>
                <td>${row.spec}</td>
                <td>${row.local}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- FILTER LOGIC ---
    function applyFilters() {
        const searchText = document.getElementById('search-input').value.toLowerCase();
        const categoryValue = document.getElementById('category-filter').value;
        const hideZeros = document.getElementById('hide-zeros').checked;

        const filteredData = rawData.filter(row => {
            // Search Filter
            const matchesSearch = row.title.toLowerCase().includes(searchText);
            
            // Category Filter
            const matchesCategory = categoryValue === 'all' || row.category.toString() === categoryValue;
            
            // Hide Zeros Filter
            const matchesZero = !hideZeros || row.total > 0;

            return matchesSearch && matchesCategory && matchesZero;
        });

        renderTable(filteredData);
        updateStats(filteredData);
        renderChart(filteredData);
    }

    // --- UPDATE STATISTICS ---
    function updateStats(data) {
        const totalJobs = data.reduce((sum, row) => sum + row.total, 0);
        const totalRows = data.length;
        const maxCategory = data.length > 0 ? Math.max(...data.map(r => r.category)) : 0;

        document.getElementById('total-jobs').innerText = totalJobs.toLocaleString();
        document.getElementById('total-rows').innerText = totalRows;
        document.getElementById('max-category').innerText = maxCategory;
    }

    // --- RENDER CHART ---
    let myChart = null;
    function renderChart(data) {
        const ctx = document.getElementById('jobsChart').getContext('2d');
        
        // Take top 10 jobs by total for the chart
        const sortedData = [...data].sort((a, b) => b.total - a.total).slice(0, 10);
        
        const labels = sortedData.map(r => r.title.substring(0, 20) + '...');
        const values = sortedData.map(r => r.total);

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'عدد المناصب (المجموع)',
                    data: values,
                    backgroundColor: 'rgba(52, 152, 219, 0.7)',
                    borderColor: 'rgba(52, 152, 219, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'أعلى 10 مناصب من حيث العدد', font: { size: 16 } }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }
</script>
</body>
</html>

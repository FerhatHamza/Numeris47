<script>
(function () {
  'use strict';
  try {
    const OVERLAY_ID = '__blocked_overlay__';
    const CONFIG = {
      THRESHOLD: 300,     // much safer — docked devtools usually adds 300+ px
      INTERVAL: 1000,     // check once per second
      GRACE_MS: 3500      // wait 3.5s after load before starting detection
    };
    let locked = false;
    let polling = false;

    function ensureOverlay() {
      let el = document.getElementById(OVERLAY_ID);
      if (el) return el;
      el = document.createElement('div');
      el.id = OVERLAY_ID;
      el.style.cssText =
        'position:fixed;inset:0;z-index:2147483647;' +
        'background:#0f172a;color:#f8fafc;' +
        'display:none;align-items:center;justify-content:center;' +
        'font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;' +
        'text-align:center;padding:24px;user-select:none;';
      el.innerHTML =
        '<div style="max-width:520px">' +
          '<div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#f87171;font-weight:700;margin-bottom:14px">Accès refusé</div>' +
          '<h1 style="font-size:28px;font-weight:700;margin:0 0 12px 0;line-height:1.2">Outils de développement détectés</h1>' +
          '<p style="font-size:14px;color:#94a3b8;line-height:1.6;margin:0 0 22px 0">L\'inspection du code source et l\'utilisation des outils de développement sont désactivées sur cette application.</p>' +
          '<div style="display:inline-block;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 16px;font-size:12px;color:#cbd5e1;font-family:ui-monospace,monospace">Veuillez fermer les outils de développement pour continuer.</div>' +
          '<div style="margin-top:22px;font-size:11px;color:#64748b">DME Ghardaïa — Accès protégé</div>' +
        '</div>';
      (document.body || document.documentElement).appendChild(el);
      return el;
    }

    function showOverlay() {
      if (locked) return;
      locked = true;
      const el = ensureOverlay();
      if (el) el.style.display = 'flex';
      document.documentElement.style.overflow = 'hidden';
    }

    function hideOverlay() {
      if (!locked) return;
      locked = false;
      const el = document.getElementById(OVERLAY_ID);
      if (el) el.style.display = 'none';
      document.documentElement.style.overflow = '';
    }

    /* Block right-click */
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault(); e.stopPropagation(); return false;
    }, true);

    /* Block devtools keyboard shortcuts only */
    function onKeyDown(e) {
      const k = (e.key || '').toLowerCase();
      const ctrl = e.ctrlKey || e.metaKey;
      const shift = e.shiftKey;
      let block = false;

      if (k === 'f12') block = true;
      else if (ctrl && shift && (k === 'i' || k === 'j' || k === 'c' || k === 'k')) block = true;
      else if (ctrl && !shift && k === 'u') block = true;

      if (block) {
        e.preventDefault();
        e.stopPropagation();
        showOverlay();
        return false;
      }
    }
    document.addEventListener('keydown', onKeyDown, true);
    window.addEventListener('keydown', onKeyDown, true);

    /* Detect open devtools by window size difference */
    function isOpenBySize() {
      const w = window.outerWidth - window.innerWidth;
      const h = window.outerHeight - window.innerHeight;
      return w > CONFIG.THRESHOLD || h > CONFIG.THRESHOLD;
    }

    function poll() {
      if (isOpenBySize()) showOverlay();
      else if (locked) hideOverlay();
    }

    function startPolling() {
      if (polling) return;
      polling = true;
      setInterval(poll, CONFIG.INTERVAL);
    }

    window.addEventListener('load', function () {
      ensureOverlay();
      /* Grace period: don't start detection for 3.5 seconds */
      setTimeout(startPolling, CONFIG.GRACE_MS);
    });

    /* Also ensure overlay exists as soon as body is ready */
    document.addEventListener('DOMContentLoaded', ensureOverlay);
  } catch (err) {
    console.error('Protection layer error:', err);
  }
})();
</script>

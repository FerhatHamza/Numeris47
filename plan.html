<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DME — Généralisation &amp; Formation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .scroll-x{overflow-x:auto}
  .scroll-x::-webkit-scrollbar{height:8px}
  .scroll-x::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  input,select{outline:none}
  input:focus,select:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<header class="bg-slate-900 text-white sticky top-0 z-30 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex items-center justify-between h-16 gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-indigo-500 grid place-items-center font-bold shrink-0">D</div>
        <div class="min-w-0">
          <h1 class="font-semibold leading-tight truncate">DME — Généralisation &amp; Formation</h1>
          <p class="text-[11px] text-slate-400 leading-tight">Pilotage du déploiement · Paramétrage · Licences · Formation</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button data-act="export" class="hidden sm:inline-flex text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700">Exporter JSON</button>
        <button data-act="reset-all" class="text-xs px-3 py-2 rounded-lg bg-rose-600/90 hover:bg-rose-600">Réinitialiser</button>
      </div>
    </div>
    <nav id="nav" class="flex gap-1 overflow-x-auto pb-2 -mb-px"></nav>
  </div>
</header>

<main id="view" class="max-w-7xl mx-auto p-4 sm:p-6"></main>

<script>
/* ============================ HELPERS ============================ */
const LS_KEY = 'dme_plan_v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmt = d => d ? new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'2-digit' }) : '—';
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

const PHASES = ['Cadrage','Paramétrage','Infrastructure','PCs & Licences','Utilisateurs','Formation','Go-live'];

const PC_STATUTS = {
  NON_INSTALLE:      { l:'Non installé',        c:'bg-slate-100 text-slate-600 ring-slate-200' },
  DEMANDE_EN_ATTENTE:{ l:'Demande en attente',  c:'bg-amber-100 text-amber-700 ring-amber-200' },
  VALIDEE:           { l:'Demande validée',     c:'bg-blue-100 text-blue-700 ring-blue-200' },
  CLE_GENEREE:       { l:'Clé générée',         c:'bg-indigo-100 text-indigo-700 ring-indigo-200' },
  ACTIVE:            { l:'Activée',             c:'bg-emerald-100 text-emerald-700 ring-emerald-200' }
};
const TACHE_STATUTS = {
  A_FAIRE:  { l:'À faire',  c:'bg-slate-100 text-slate-600 ring-slate-200' },
  EN_COURS: { l:'En cours', c:'bg-blue-100 text-blue-700 ring-blue-200' },
  TERMINE:  { l:'Terminé',  c:'bg-emerald-100 text-emerald-700 ring-emerald-200' },
  BLOQUE:   { l:'Bloqué',   c:'bg-rose-100 text-rose-700 ring-rose-200' }
};
const FORM_STATUTS = {
  PLANIFIEE:{ l:'Planifiée', c:'bg-slate-100 text-slate-600 ring-slate-200' },
  EN_COURS: { l:'En cours',  c:'bg-blue-100 text-blue-700 ring-blue-200' },
  TERMINEE: { l:'Terminée',  c:'bg-emerald-100 text-emerald-700 ring-emerald-200' }
};

const badge = (map, key) => {
  const s = map[key] || { l:key, c:'bg-slate-100 text-slate-600 ring-slate-200' };
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium ring-1 ${s.c} whitespace-nowrap">${esc(s.l)}</span>`;
};

const genKey = () => {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const blk = () => Array.from({length:4}, () => c[Math.floor(Math.random()*c.length)]).join('');
  return [blk(),blk(),blk(),blk()].join('-');
};

/* ============================ SEED ============================ */
function seed() {
  const today = new Date();
  const dt = off => { const x = new Date(today); x.setDate(x.getDate() + off); return x.toISOString().slice(0,10); };

  const etablissements = [], services = [], unites = [], salles = [];
  const addE = nom => { const id = uid(); etablissements.push({ id, nom }); return id; };
  const addS = (etabId, nom) => { const id = uid(); services.push({ id, etabId, nom }); return id; };

  const e1 = addE('Polyclinique Bailich Mazouz');
  addS(e1, 'Polyclinique Bailich Mazouz');
  addS(e1, 'Laboratoire Poly. Bailich Mazouz');
  addS(e1, 'Radiologie Poly. Bailich Mazouz');

  const e2 = addE('Polyclinique Vieux Ksar');
  addS(e2, 'Polyclinique Vieux Ksar');
  addS(e2, 'Laboratoire Poly. Vieux Ksar');
  addS(e2, 'Radiologie Poly. Vieux Ksar');

  const e3 = addE('Polyclinique du martyr officier Ahmed Taleb');
  addS(e3, 'Polyclinique du martyr officier Ahmed Taleb');
  addS(e3, 'Urgences Médicales');
  addS(e3, 'Laboratoire Poly. martyr officier Ahmed Taleb');
  addS(e3, 'Radiologie Poly. martyr officier Ahmed Taleb');

  const e4 = addE('Services centraux');
  addS(e4, 'Stomatologie');
  addS(e4, 'Pharmacie Centrale');
  addS(e4, "Service d'hémodialyse");
  addS(e4, "Service d'Épidémiologie et de Médecine Préventive");
  addS(e4, 'Service Imagerie Médical et Radiologie');

  // Unités + salles pour les 6 premiers services (démo)
  services.slice(0, 6).forEach((s, i) => {
    const u = { id: uid(), serviceId: s.id, nom: 'Unité principale' };
    unites.push(u);
    salles.push({ id: uid(), uniteId: u.id, nom: 'Salle ' + (i + 1) });
  });

  const pcs = [];
  const addPc = (code, host, sIdx, statut) => {
    const s = services[sIdx];
    const salle = salles.find(x => {
      const u = unites.find(u => u.id === x.uniteId);
      return u && u.serviceId === s.id;
    });
    pcs.push({
      id: uid(), code, hostname: host, serviceId: s.id,
      salleId: salle ? salle.id : null, userId: null, statut,
      cle: statut === 'CLE_GENEREE' || statut === 'ACTIVE' ? genKey() : null,
      dateDemande: statut !== 'NON_INSTALLE' ? dt(-3) : null,
      dateValidation: ['VALIDEE','CLE_GENEREE','ACTIVE'].includes(statut) ? dt(-2) : null,
      dateActivation: statut === 'ACTIVE' ? dt(-1) : null
    });
  };
  addPc('PC-001','PC-ACCUEIL-01', 0, 'ACTIVE');
  addPc('PC-002','PC-LABO-01',    1, 'CLE_GENEREE');
  addPc('PC-003','PC-RADIO-01',   2, 'DEMANDE_EN_ATTENTE');
  addPc('PC-004','PC-URG-01',     7, 'VALIDEE');
  addPc('PC-005','PC-PHAR-01',   12, 'NON_INSTALLE');
  addPc('PC-006','PC-HEMO-01',   13, 'NON_INSTALLE');

  const users = [
    { id: uid(), nom:'Benali', prenom:'Amina', role:'Médecin', serviceId: services[0].id, pcId: pcs[0].id, actif:true },
    { id: uid(), nom:'Khelifi', prenom:'Yacine', role:'Technicien Labo', serviceId: services[1].id, pcId: pcs[1].id, actif:true },
    { id: uid(), nom:'Mansouri', prenom:'Nadia', role:'Manipulatrice Radio', serviceId: services[2].id, pcId: pcs[2].id, actif:true },
    { id: uid(), nom:'Bouzid', prenom:'Karim', role:'Infirmier', serviceId: services[7].id, pcId: pcs[3].id, actif:true }
  ];

  const serveurs = [
    { id: uid(), nom:'SRV-DME-APP', type:'Application', ip:'192.168.10.10', role:'Serveur DME + API', statut:'EN_COURS', dateConfig: dt(7) },
    { id: uid(), nom:'SRV-DME-DB',  type:'Base de données', ip:'192.168.10.11', role:'PostgreSQL', statut:'A_FAIRE', dateConfig: dt(10) },
    { id: uid(), nom:'SRV-DME-BKP', type:'Sauvegarde', ip:'192.168.10.12', role:'Backup nocturne', statut:'A_FAIRE', dateConfig: dt(14) }
  ];

  const stockages = [
    { id: uid(), nom:'SAN-DME-01', type:'SAN', capacite:'8 To', serveurId: serveurs[0].id, statut:'EN_COURS' },
    { id: uid(), nom:'NAS-ARCHIVES', type:'NAS', capacite:'16 To', serveurId: serveurs[2].id, statut:'A_FAIRE' }
  ];

  const formations = [
    { id: uid(), module:'Environnement de simulation DME', public:'Équipe projet', formateur:'IT DME', date: dt(21), salle:'Salle informatique', statut:'PLANIFIEE' },
    { id: uid(), module:'Administration DME (licences, users)', public:'Admins DME', formateur:'IT DME', date: dt(28), salle:'Salle informatique', statut:'PLANIFIEE' },
    { id: uid(), module:'DME Laboratoire', public:'Techniciens Labo', formateur:'Référent Labo', date: dt(38), salle:'Salle de réunion A', statut:'PLANIFIEE' },
    { id: uid(), module:'DME Radiologie & Imagerie', public:'Manipulateurs Radio', formateur:'Référent Radio', date: dt(42), salle:'Salle de réunion B', statut:'PLANIFIEE' },
    { id: uid(), module:'DME Urgences', public:'Personnel Urgences', formateur:'Référent Urgences', date: dt(46), salle:'Salle de réunion A', statut:'PLANIFIEE' }
  ];

  const T = (phase, nom, responsable, d1, d2, statut, prog) => ({
    id: uid(), phase, nom, responsable, debut: dt(d1), fin: dt(d2), statut, progress: prog
  });
  const taches = [
    T('Cadrage','Validation du périmètre & inventaire','Chef de projet', 0, 7, 'EN_COURS', 60),
    T('Cadrage','Désignation des référents par service','Direction', 2, 7, 'A_FAIRE', 0),

    T('Paramétrage','Création des établissements & services','Admin DME', 7, 14, 'A_FAIRE', 0),
    T('Paramétrage','Création des unités & salles','Admin DME', 14, 21, 'A_FAIRE', 0),

    T('Infrastructure','Configuration serveur application','Ingénieur Système', 7, 21, 'EN_COURS', 45),
    T('Infrastructure','Configuration base de données','Ingénieur Système', 10, 24, 'A_FAIRE', 0),
    T('Infrastructure','Configuration stockage & sauvegarde','Ingénieur Système', 14, 28, 'A_FAIRE', 0),
    T('Infrastructure','Tests, sécurité & recette technique','Équipe IT', 28, 35, 'A_FAIRE', 0),

    T('PCs & Licences','Inventaire du parc PC','Technicien', 21, 28, 'A_FAIRE', 0),
    T('PCs & Licences','Installation du client DME','Technicien', 28, 35, 'A_FAIRE', 0),
    T('PCs & Licences','Demandes, validation & activation des licences','Admin DME', 35, 42, 'A_FAIRE', 0),

    T('Utilisateurs','Création des comptes & affectation aux services','Admin DME', 42, 49, 'A_FAIRE', 0),

    T('Formation','Installation de l\u2019environnement de simulation','Équipe IT', 21, 28, 'A_FAIRE', 0),
    T('Formation','Formation des administrateurs DME','IT DME', 28, 35, 'A_FAIRE', 0),
    T('Formation','Formation des référents de services','Formateurs', 35, 49, 'A_FAIRE', 0),
    T('Formation','Évaluations & certification','Formateurs', 49, 56, 'A_FAIRE', 0),

    T('Go-live','Bascule & support post-déploiement','Équipe projet', 56, 63, 'A_FAIRE', 0),
    T('Go-live','PV de réception & clôture','Chef de projet', 63, 70, 'A_FAIRE', 0)
  ];

  return { etablissements, services, unites, salles, pcs, users, serveurs, stockages, formations, taches };
}

/* ============================ STATE ============================ */
let state = load();
let tab = 'dashboard';

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return seed();
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ============================ LOOKUPS ============================ */
const svc = id => state.services.find(s => s.id === id);
const etabOf = id => { const s = svc(id); return s ? state.etablissements.find(e => e.id === s.etabId) : null; };
const svcName = id => svc(id)?.nom || '—';
const userOf = id => state.users.find(u => u.id === id);
const pcOf = id => state.pcs.find(p => p.id === id);
const salleName = id => state.salles.find(s => s.id === id)?.nom || '—';

const serviceOptions = (sel) => state.services
  .map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.nom)}</option>`).join('');

const salleOptions = (sel) => {
  const groups = state.unites.map(u => {
    const ss = state.salles.filter(x => x.uniteId === u.id);
    if (!ss.length) return '';
    return `<optgroup label="${esc(svcName(u.serviceId))} — ${esc(u.nom)}">` +
      ss.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.nom)}</option>`).join('') +
      `</optgroup>`;
  }).join('');
  return `<option value="">— Aucune —</option>` + groups;
};

/* ============================ VIEWS ============================ */
function kpiCard(label, value, sub, pct, color) {
  return `<div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
    <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">${esc(label)}</div>
    <div class="mt-1 text-2xl font-bold text-slate-900">${value}</div>
    <div class="text-[11px] text-slate-500 mt-0.5">${esc(sub || '')}</div>
    ${pct != null ? `<div class="mt-3 h-1.5 rounded-full bg-slate-100 overflow-hidden">
        <div class="h-full rounded-full ${color}" style="width:${Math.min(100, Math.max(0, pct))}%"></div>
      </div>` : ''}
  </div>`;
}

function viewDashboard() {
  const totalSvc = state.services.length;
  const svcParam = state.services.filter(s => state.unites.some(u => u.serviceId === s.id)).length;
  const totalPc = state.pcs.length;
  const pcInstalled = state.pcs.filter(p => p.statut !== 'NON_INSTALLE').length;
  const licActive = state.pcs.filter(p => p.statut === 'ACTIVE').length;
  const pending = state.pcs.filter(p => p.statut === 'DEMANDE_EN_ATTENTE').length;
  const totalUsers = state.users.length;
  const usersOk = state.users.filter(u => u.serviceId && u.pcId).length;
  const totalSrv = state.serveurs.length;
  const srvOk = state.serveurs.filter(s => s.statut === 'TERMINE').length;
  const totalForm = state.formations.length;
  const formDone = state.formations.filter(f => f.statut === 'TERMINEE').length;
  const totalT = state.taches.length;
  const doneT = state.taches.filter(t => t.statut === 'TERMINE').length;
  const lateT = state.taches.filter(t => t.statut !== 'TERMINE' && new Date(t.fin) < new Date());

  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

  const globalPct = Math.round(state.taches.reduce((a, t) => a + (t.statut === 'TERMINE' ? 100 : t.progress || 0), 0) / (totalT || 1));

  // alerts
  const alerts = [];
  if (pending) alerts.push({ t:'warning', msg:`${pending} demande(s) de licence en attente de validation Admin DME.` });
  lateT.forEach(t => alerts.push({ t:'danger', msg:`Tâche en retard : « ${t.nom} » (échéance ${fmt(t.fin)}) — ${t.responsable}` }));
  state.pcs.filter(p => p.statut === 'NON_INSTALLE').forEach(p => alerts.push({ t:'info', msg:`Client DME non installé sur ${p.hostname} (${p.code}).` }));
  state.formations.filter(f => f.statut === 'PLANIFIEE' && daysBetween(todayISO(), f.date) <= 7 && daysBetween(todayISO(), f.date) >= 0)
    .forEach(f => alerts.push({ t:'info', msg:`Formation dans ${daysBetween(todayISO(), f.date)} j : « ${f.module} »` }));

  const alertStyle = { danger:'bg-rose-50 border-rose-200 text-rose-800', warning:'bg-amber-50 border-amber-200 text-amber-800', info:'bg-slate-50 border-slate-200 text-slate-700' };

  // phases
  const phaseRows = PHASES.map(p => {
    const ts = state.taches.filter(t => t.phase === p);
    if (!ts.length) return '';
    const p2 = Math.round(ts.reduce((a, t) => a + (t.statut === 'TERMINE' ? 100 : t.progress || 0), 0) / ts.length);
    const late = ts.filter(t => t.statut !== 'TERMINE' && new Date(t.fin) < new Date()).length;
    return `<div class="flex items-center gap-3">
      <div class="w-40 shrink-0 text-sm font-medium text-slate-700">${esc(p)}</div>
      <div class="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden">
        <div class="h-full rounded-full ${p2 === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}" style="width:${p2}%"></div>
      </div>
      <div class="w-12 text-right text-xs font-semibold text-slate-600">${p2}%</div>
      <div class="w-20 text-right text-[11px] ${late ? 'text-rose-600 font-semibold' : 'text-slate-400'}">${late ? late + ' retard' : ts.length + ' tâches'}</div>
    </div>`;
  }).join('');

  return `
  <div class="space-y-6">
    <div class="flex items-end justify-between flex-wrap gap-3">
      <div>
        <h2 class="text-xl font-bold text-slate-900">Tableau de bord</h2>
        <p class="text-sm text-slate-500">Avancement global du projet de généralisation du DME</p>
      </div>
      <div class="flex items-center gap-3 bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-sm">
        <span class="text-xs font-semibold uppercase text-slate-500">Avancement global</span>
        <span class="text-2xl font-bold ${globalPct >= 100 ? 'text-emerald-600' : 'text-indigo-600'}">${globalPct}%</span>
      </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${kpiCard('Paramétrage', `${svcParam}/${totalSvc}`, 'services avec unités', pct(svcParam, totalSvc), 'bg-indigo-500')}
      ${kpiCard('Parc PC', `${pcInstalled}/${totalPc}`, 'clients DME installés', pct(pcInstalled, totalPc), 'bg-sky-500')}
      ${kpiCard('Licences actives', `${licActive}/${totalPc}`, `${pending} en attente`, pct(licActive, totalPc), 'bg-emerald-500')}
      ${kpiCard('Utilisateurs', `${usersOk}/${totalUsers}`, 'comptes affectés (service + PC)', pct(usersOk, totalUsers), 'bg-violet-500')}
      ${kpiCard('Serveurs prêts', `${srvOk}/${totalSrv}`, 'application / DB / backup', pct(srvOk, totalSrv), 'bg-amber-500')}
      ${kpiCard('Formations', `${formDone}/${totalForm}`, 'sessions terminées', pct(formDone, totalForm), 'bg-fuchsia-500')}
      ${kpiCard('Tâches', `${doneT}/${totalT}`, 'tâches terminées', pct(doneT, totalT), 'bg-teal-500')}
      ${kpiCard('Retards', `${lateT.length}`, lateT.length ? 'action requise' : 'aucun retard', null, '')}
    </div>

    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
        <h3 class="font-semibold text-slate-900 mb-4">Avancement par phase</h3>
        <div class="space-y-3">${phaseRows || '<p class="text-sm text-slate-400">Aucune tâche.</p>'}</div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
        <h3 class="font-semibold text-slate-900 mb-3">Alertes &amp; actions</h3>
        <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
          ${alerts.length ? alerts.slice(0, 25).map(a => `
            <div class="text-xs border rounded-lg px-3 py-2 ${alertStyle[a.t]}">${esc(a.msg)}</div>
          `).join('') : '<p class="text-sm text-slate-400">Aucune alerte. 🎉</p>'}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------------- PARAMÉTRAGE ---------------- */
function viewParam() {
  const etabs = state.etablissements.map(e => {
    const svcs = state.services.filter(s => s.etabId === e.id);
    return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 bg-slate-50 border-b border-slate-200">
        <div class="flex items-center gap-2">
          <span class="text-lg">🏥</span>
          <span class="font-semibold text-slate-900">${esc(e.nom)}</span>
          <span class="text-[11px] text-slate-500">${svcs.length} service(s)</span>
        </div>
        <button data-act="del-etab" data-id="${e.id}" class="text-xs text-rose-600 hover:bg-rose-50 px-2 py-1 rounded">Supprimer</button>
      </div>
      <div class="p-4 space-y-3">
        ${svcs.map(s => serviceBlock(s)).join('') || '<p class="text-xs text-slate-400">Aucun service.</p>'}
        <div class="flex gap-2 pt-1">
          <input data-in="svc-${e.id}" placeholder="Nom du nouveau service…" class="flex-1 text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white">
          <button data-act="add-service" data-id="${e.id}" class="text-sm px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 whitespace-nowrap">+ Service</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="space-y-6">
    <div>
      <h2 class="text-xl font-bold text-slate-900">Paramétrage</h2>
      <p class="text-sm text-slate-500">Établissements → Services → Unités → Salles</p>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row gap-2">
      <input id="new-etab" placeholder="Nom du nouvel établissement…" class="flex-1 text-sm border border-slate-300 rounded-lg px-3 py-2">
      <button data-act="add-etab" class="text-sm px-4 py-2 rounded-lg bg-slate-900 text-white hover:bg-slate-800">+ Établissement</button>
    </div>

    <div class="space-y-4">${etabs || '<p class="text-sm text-slate-400">Aucun établissement.</p>'}</div>
  </div>`;
}

function serviceBlock(s) {
  const us = state.unites.filter(u => u.serviceId === s.id);
  return `<div class="border-l-2 border-indigo-200 pl-3">

      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm scroll-x">
      <table class="w-full text-left min-w-[1000px]">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr class="text-[11px] uppercase tracking-wide text-slate-500">
            <th class="px-3 py-3 font-semibold">Module</th><th class="px-3 py-3 font-semibold">Public</th>
            <th class="px-3 py-3 font-semibold">Formateur</th><th class="px-3 py-3 font-semibold">Salle</th>
            <th class="px-3 py-3 font-semibold">Date</th><th class="px-3 py-3 font-semibold">Statut</th>
            <th class="px-3 py-3 font-semibold text-right">Actions</th>
          </tr>
        </thead>
        <tbody>${rows || '<tr><td colspan="7" class="px-3 py-8 text-center text-sm text-slate-400">Aucune session planifiée.</td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

/* ---------------- PLANNING ---------------- */
function viewPlanning() {
  const tasks = state.taches;
  if (!tasks.length) return '<p class="text-sm text-slate-400">Aucune tâche.</p>';

  const min = Math.min(...tasks.map(t => +new Date(t.debut)));
  const max = Math.max(...tasks.map(t => +new Date(t.fin)));
  const span = (max - min) || 1;
  const todayPct = ((Date.now() - min) / span) * 100;

  const rows = PHASES.map(p => {
    const ts = tasks.filter(t => t.phase === p);
    if (!ts.length) return '';
    const pct = Math.round(ts.reduce((a, t) => a + (t.statut === 'TERMINE' ? 100 : t.progress || 0), 0) / ts.length);
    return `
      <tr class="bg-slate-50/80 border-y border-slate-200">
        <td colspan="7" class="px-3 py-2">
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold uppercase tracking-wide text-slate-700">${esc(p)}</span>
            <div class="flex-1 h-1.5 rounded-full bg-slate-200 overflow-hidden max-w-xs">
              <div class="h-full rounded-full ${pct === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}" style="width:${pct}%"></div>
            </div>
            <span class="text-[11px] font-semibold text-slate-500">${pct}%</span>
          </div>
        </td>
      </tr>` + ts.map(t => {
        const s = +new Date(t.debut), e = +new Date(t.fin);
        const left = ((s - min) / span) * 100;
        const w = Math.max(0.8, ((e - s) / span) * 100);
        const late = t.statut !== 'TERMINE' && new Date(t.fin) < new Date();
        const barColor = t.statut === 'TERMINE' ? 'bg-emerald-500'
          : t.statut === 'BLOQUE' ? 'bg-rose-500'
          : t.statut === 'EN_COURS' ? 'bg-indigo-500' : 'bg-slate-300';
        return `<tr class="border-b border-slate-100 hover:bg-slate-50/60">
          <td class="px-3 py-2 text-sm text-slate-800">${esc(t.nom)}</td>
          <td class="px-3 py-2 text-xs text-slate-600 whitespace-nowrap">${esc(t.responsable)}</td>
          <td class="px-3 py-2 text-xs text-slate-500 whitespace-nowrap">${fmt(t.debut)}</td>
          <td class="px-3 py-2 text-xs ${late ? 'text-rose-600 font-semibold' : 'text-slate-500'} whitespace-nowrap">${fmt(t.fin)}</td>
          <td class="px-3 py-2">
            <select data-change="tache-statut" data-id="${t.id}" class="text-[11px] border border-slate-300 rounded-lg px-2 py-1 bg-white">
              ${Object.keys(TACHE_STATUTS).map(k => `<option value="${k}" ${t.statut === k ? 'selected' : ''}>${TACHE_STATUTS[k].l}</option>`).join('')}
            </select>
          </td>
          <td class="px-3 py-2">
            <input type="number" min="0" max="100" value="${t.progress || 0}" data-change="tache-progress" data-id="${t.id}"
              class="w-16 text-[11px] border border-slate-300 rounded-lg px-2 py-1">
          </td>
          <td class="px-3 py-2">
            <div class="relative h-6 bg-slate-100 rounded-md min-w-[240px]">
              <div class="absolute top-0 bottom-0 rounded-md ${barColor} opacity-90" style="left:${left}%;width:${w}%"></div>
              ${todayPct >= 0 && todayPct <= 100 ? `<div class="absolute top-0 bottom-0 w-px bg-rose-500" style="left:${todayPct}%"></div>` : ''}
            </div>
          </td>
          <td class="px-3 py-2 text-right">
            <button data-act="del-tache" data-id="${t.id}" class="text-xs text-rose-500 hover:bg-rose-50 px-2 py-1.5 rounded-lg">Suppr</button>
          </td>
        </tr>`;
      }).join('');
  }).join('');

  return `
  <div class="space-y-6">
    <div class="flex items-end justify-between flex-wrap gap-3">
      <div>
        <h2 class="text-xl font-bold text-slate-900">Planning &amp; Deadlines</h2>
        <p class="text-sm text-slate-500">Diagramme de Gantt — la ligne rouge indique la date du jour</p>
      </div>
      <div class="text-xs text-slate-500 bg-white border border-slate-200 rounded-lg px-3 py-2">
        Période : <b class="text-slate-800">${fmt(new Date(min).toISOString().slice(0,10))}</b> → <b class="text-slate-800">${fmt(new Date(max).toISOString().slice(0,10))}</b>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
      <h3 class="font-semibold text-sm text-slate-900 mb-3">Ajouter une tâche</h3>
      <div class="grid sm:grid-cols-2 lg:grid-cols-6 gap-2">
        <select id="t-phase" class="text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white">${PHASES.map(p => `<option>${p}</option>`).join('')}</select>
        <input id="t-nom" placeholder="Nom de la tâche" class="text-sm border border-slate-300 rounded-lg px-3 py-2 lg:col-span-2">
        <input id="t-resp" placeholder="Responsable" class="text-sm border border-slate-300 rounded-lg px-3 py-2">
        <input id="t-debut" type="date" class="text-sm border border-slate-300 rounded-lg px-3 py-2">
        <input id="t-fin" type="date" class="text-sm border border-slate-300 rounded-lg px-3 py-2">
        <button data-act="add-tache" class="text-sm px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 lg:col-span-2">+ Ajouter la tâche</button>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm scroll-x">
      <table class="w-full text-left min-w-[1200px]">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr class="text-[11px] uppercase tracking-wide text-slate-500">
            <th class="px-3 py-3 font-semibold">Tâche</th>
            <th class="px-3 py-3 font-semibold">Responsable</th>
            <th class="px-3 py-3 font-semibold">Début</th>
            <th class="px-3 py-3 font-semibold">Fin (deadline)</th>
            <th class="px-3 py-3 font-semibold">Statut</th>
            <th class="px-3 py-3 font-semibold">%</th>
            <th class="px-3 py-3 font-semibold w-[300px]">Chronologie</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

/* ============================ RENDER ============================ */
const TABS = [
  { id:'dashboard', icon:'📊', label:'Tableau de bord' },
  { id:'param',     icon:'⚙️', label:'Paramétrage' },
  { id:'pcs',       icon:'💻', label:'PCs & Licences' },
  { id:'users',     icon:'👥', label:'Utilisateurs' },
  { id:'infra',     icon:'🖧', label:'Infrastructure' },
  { id:'formation', icon:'🎓', label:'Formation' },
  { id:'planning',  icon:'📅', label:'Planning' }
];

const VIEWS = {
  dashboard: viewDashboard, param: viewParam, pcs: viewPcs,
  users: viewUsers, infra: viewInfra, formation: viewFormation, planning: viewPlanning
};

function render() {
  document.getElementById('nav').innerHTML = TABS.map(t => {
    const active = t.id === tab;
    return `<button data-act="tab" data-id="${t.id}"
      class="px-3 py-2 rounded-t-lg text-sm font-medium whitespace-nowrap transition
      ${active ? 'bg-slate-50 text-slate-900' : 'text-slate-300 hover:text-white hover:bg-slate-800'}">
      <span class="mr-1">${t.icon}</span>${esc(t.label)}</button>`;
  }).join('');

  document.getElementById('view').innerHTML = VIEWS[tab]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================ INPUT READER ============================ */
const val = id => (document.getElementById(id)?.value || '').trim();

/* ============================ ACTIONS ============================ */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;

  switch (act) {
    case 'tab':
      tab = id; render(); return;

    /* ---- Paramétrage ---- */
    case 'add-etab': {
      const nom = val('new-etab');
      if (!nom) return alert('Saisir le nom de l\u2019établissement.');
      state.etablissements.push({ id: uid(), nom });
      break;
    }
    case 'del-etab':
      if (!confirm('Supprimer cet établissement et tous ses services ?')) return;
      state.services.filter(s => s.etabId === id).forEach(s => {
        state.unites.filter(u => u.serviceId === s.id).forEach(u => {
          state.salles = state.salles.filter(x => x.uniteId !== u.id);
        });
        state.unites = state.unites.filter(u => u.serviceId !== s.id);
      });
      state.services = state.services.filter(s => s.etabId !== id);
      state.etablissements = state.etablissements.filter(x => x.id !== id);
      break;

    case 'add-service': {
      const nom = val('svc-' + id);
      if (!nom) return;
      state.services.push({ id: uid(), etabId: id, nom });
      break;
    }
    case 'del-service':
      if (!confirm('Supprimer ce service et ses unités/salles ?')) return;
      state.unites.filter(u => u.serviceId === id).forEach(u => {
        state.salles = state.salles.filter(x => x.uniteId !== u.id);
      });
      state.unites = state.unites.filter(u => u.serviceId !== id);
      state.services = state.services.filter(s => s.id !== id);
      break;

    case 'add-unite': {
      const nom = val('uni-' + id);
      if (!nom) return;
      state.unites.push({ id: uid(), serviceId: id, nom });
      break;
    }
    case 'del-unite':
      state.salles = state.salles.filter(x => x.uniteId !== id);
      state.unites = state.unites.filter(u => u.id !== id);
      break;

    case 'add-salle': {
      const nom = val('sal-' + id);
      if (!nom) return;
      state.salles.push({ id: uid(), uniteId: id, nom });
      break;
    }
    case 'del-salle':
      state.salles = state.salles.filter(x => x.id !== id);
      break;

    /* ---- PCs & Licences ---- */
    case 'add-pc': {
      const code = val('pc-code'), host = val('pc-host');
      const serviceId = val('pc-service'), salleId = val('pc-salle') || null;
      if (!code || !host) return alert('Code et hostname obligatoires.');
      state.pcs.push({
        id: uid(), code, hostname: host, serviceId, salleId, userId: null,
        statut: 'NON_INSTALLE', cle: null,
        dateDemande: null, dateValidation: null, dateActivation: null
      });
      break;
    }
    case 'pc-next': {
      const p = pcOf(id); if (!p) return;
      if (p.statut === 'NON_INSTALLE') { p.statut = 'DEMANDE_EN_ATTENTE'; p.dateDemande = todayISO(); }
      else if (p.statut === 'DEMANDE_EN_ATTENTE') { p.statut = 'VALIDEE'; p.dateValidation = todayISO(); }
      else if (p.statut === 'VALIDEE') { p.statut = 'CLE_GENEREE'; p.cle = genKey(); }
      else if (p.statut === 'CLE_GENEREE') { p.statut = 'ACTIVE'; p.dateActivation = todayISO(); }
      break;
    }
    case 'pc-reset':
      if (!confirm('Réinitialiser le cycle de licence de ce PC ?')) return;
      Object.assign(pcOf(id), { statut:'NON_INSTALLE', cle:null, dateDemande:null, dateValidation:null, dateActivation:null });
      break;
    case 'del-pc':
      if (!confirm('Supprimer ce PC ?')) return;
      state.pcs = state.pcs.filter(p => p.id !== id);
      state.users.forEach(u => { if (u.pcId === id) u.pcId = null; });
      break;

    /* ---- Utilisateurs ---- */
    case 'add-user': {
      const nom = val('u-nom'), prenom = val('u-prenom'), role = val('u-role'), serviceId = val('u-service');
      if (!nom || !prenom) return alert('Nom et prénom obligatoires.');
      state.users.push({ id: uid(), nom, prenom, role: role || 'Utilisateur', serviceId, pcId: null, actif: true });
      break;
    }
    case 'del-user':
      state.users = state.users.filter(u => u.id !== id);
      state.pcs.forEach(p => { if (p.userId === id) p.userId = null; });
      break;

    /* ---- Infrastructure ---- */
    case 'add-serveur': {
      const nom = val('s-nom');
      if (!nom) return alert('Nom du serveur obligatoire.');
      state.serveurs.push({
        id: uid(), nom, type: val('s-type') || '—', ip: val('s-ip') || '—',
        role: val('s-role') || '—', statut: 'A_FAIRE', dateConfig: val('s-date') || todayISO()
      });
      break;
    }
    case 'del-serveur':
      state.serveurs = state.serveurs.filter(s => s.id !== id);
      state.stockages.forEach(s => { if (s.serveurId === id) s.serveurId = null; });
      break;
    case 'add-stockage': {
      const nom = val('k-nom');
      if (!nom) return alert('Nom du stockage obligatoire.');
      state.stockages.push({
        id: uid(), nom, type: val('k-type') || '—', capacite: val('k-cap') || '—',
        serveurId: val('k-srv') || null, statut: 'A_FAIRE'
      });
      break;
    }
    case 'del-stockage':
      state.stockages = state.stockages.filter(s => s.id !== id);
      break;

    /* ---- Formation ---- */
    case 'add-formation': {
      const module = val('f-module');
      if (!module) return alert('Intitulé du module obligatoire.');
      state.formations.push({
        id: uid(), module, public: val('f-public') || '—', formateur: val('f-formateur') || '—',
        salle: val('f-salle') || '—', date: val('f-date') || todayISO(), statut: 'PLANIFIEE'
      });
      break;
    }
    case 'del-formation':
      state.formations = state.formations.filter(f => f.id !== id);
      break;

    /* ---- Planning ---- */
    case 'add-tache': {
      const nom = val('t-nom');
      if (!nom) return alert('Nom de la tâche obligatoire.');
      const debut = val('t-debut') || todayISO();
      const fin = val('t-fin') || debut;
      if (new Date(fin) < new Date(debut)) return alert('La date de fin doit être après la date de début.');
      state.taches.push({
        id: uid(), phase: val('t-phase'), nom, responsable: val('t-resp') || '—',
        debut, fin, statut: 'A_FAIRE', progress: 0
      });
      break;
    }
    case 'del-tache':
      if (!confirm('Supprimer cette tâche ?')) return;
      state.taches = state.taches.filter(t => t.id !== id);
      break;

    /* ---- Global ---- */
    case 'reset-all':
      if (!confirm('Réinitialiser toutes les données du projet ? Cette action est irréversible.')) return;
      state = seed(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dme-plan-' + todayISO() + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
    default: return;
  }

  save(); render();
});

/* ============================ CHANGE HANDLER ============================ */
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  const id = el.dataset.id;
  const v = el.value;

  if (kind === 'user-svc') {
    const u = state.users.find(x => x.id === id); if (u) u.serviceId = v;
  } else if (kind === 'user-pc') {
    const u = state.users.find(x => x.id === id); if (u) u.pcId = v || null;
    state.pcs.forEach(p => { if (p.userId === id && p.id !== v) p.userId = null; });
    const pc = pcOf(v); if (pc) pc.userId = id;
  } else if (kind === 'srv-statut') {
    const s = state.serveurs.find(x => x.id === id); if (s) s.statut = v;
  } else if (kind === 'stk-statut') {
    const s = state.stockages.find(x => x.id === id); if (s) s.statut = v;
  } else if (kind === 'form-statut') {
    const f = state.formations.find(x => x.id === id); if (f) f.statut = v;
  } else if (kind === 'tache-statut') {
    const t = state.taches.find(x => x.id === id);
    if (t) { t.statut = v; if (v === 'TERMINE') t.progress = 100; }
  } else if (kind === 'tache-progress') {
    const t = state.taches.find(x => x.id === id);
    if (t) { t.progress = Math.max(0, Math.min(100, parseInt(v, 10) || 0)); if (t.progress === 100 && t.statut !== 'TERMINE') t.statut = 'TERMINE'; }
  } else return;

  save(); render();
});

/* ============================ BOOT ============================ */
render();
</script>
</body>
</html>
